mcs.metadata:
  componentName: Add my entry
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: organization
    value: =Env.tk_DataverseUrl

  - kind: ManualTaskInput
    propertyName: entityName
    value: tk_timeentries

  - kind: ManualTaskInput
    propertyName: item.'tk_Employee@odata.bind'
    value: ="tk_employees(" & Global.EmployeeId & ")"

  - kind: ManualTaskInput
    propertyName: item.'tk_status'
    value: 495690000

  - kind: AutomaticTaskInput
    propertyName: item.'tk_title'
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: item.'tk_Project@odata.bind'
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: item.'tk_workdate'
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: item.'tk_hours'
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: item.'tk_notes'
    shouldPromptUser: false

modelDisplayName: Add my entry
modelDescription: Creates one Draft time entry for the signed-in user. Only call it after the user said yes to the exact project, date and hours. Set tk_Project@odata.bind to tk_projects(<tk_projectid from Active projects>), tk_workdate as yyyy-mm-dd, tk_hours as a number, tk_title as '<project name> <yyyy-mm-dd>'. The employee and status are set automatically.
outputs:
  - propertyName: tk_timeentryid
    name: Time Entry

  - propertyName: tk_status
    name: Status

action:
  kind: InvokeConnectorTaskAction
  connectionReference: tk_dataverse
  connectionProperties:
    mode: Maker

  operationId: CreateRecordWithOrganization
  dynamicInputSchema:
    properties:
      organization:
        displayName: Environment
        description: Choose an environment
        nameForModel: organization
        isRequired: true
        order: 0
        dynamicValuesConfig:
          capability: List

        type: String

      entityName:
        displayName: Table name
        description: Choose a table
        nameForModel: entity_name
        isRequired: true
        order: 1
        dynamicValuesConfig:
          capability: List

        type: String

      item:
        displayName: Row Item
        description: Row
        isRequired: true
        order: 3
        type:
          kind: Record
          properties:
            tk_Employee@odata.bind:
              displayName: tk_Employee@odata.bind
              order: 0
              type: String

            tk_Project@odata.bind:
              displayName: tk_Project@odata.bind
              order: 1
              type: String

            tk_title:
              displayName: tk_title
              order: 2
              type: String

            tk_workdate:
              displayName: tk_workdate
              order: 3
              type: DateTime

            tk_hours:
              displayName: tk_hours
              order: 4
              type: Number

            tk_notes:
              displayName: tk_notes
              order: 5
              type: String

            tk_status:
              displayName: tk_status
              order: 6
              type: Number


  dynamicOutputSchema:
    kind: Record
    properties:
      tk_timeentryid:
        displayName: Time Entry
        order: 0
        type: String

      tk_status:
        displayName: Status
        order: 1
        type: Number

outputMode: All
